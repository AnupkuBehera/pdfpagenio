<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="50%" stop-color="#E5322D"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#FF7A7A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 250) rotate(90) scale(400)">
      <stop offset="0%" stop-color="#E5322D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E5322D" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="0" y="0" width="160" height="160" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#E5322D" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="280" cy="280" r="350" fill="url(#glow)"/>

  <!-- Grid overlay subtle pattern -->
  <g opacity="0.04">
    <path d="M0 63H1200M0 126H1200M0 189H1200M0 252H1200M0 315H1200M0 378H1200M0 441H1200M0 504H1200M0 567H1200" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Logo Mark -->
  <g transform="translate(100, 110)">
    <!-- Shadowed Rounded Badge -->
    <rect width="96" height="96" rx="24" fill="url(#brandGrad)" filter="url(#shadow)"/>
    <!-- Fold Accent Inside Badge -->
    <path d="M30 24H60C71 24 80 33 80 44C80 55 71 64 60 64H30V24Z" fill="#FFFFFF"/>
    <rect x="22" y="24" width="16" height="48" rx="4" fill="#FFFFFF"/>
    <path d="M34 36H58C62 36 66 40 66 44C66 48 62 52 58 52H34V36Z" fill="url(#brandGrad)"/>
    <path d="M58 24L80 46H64C60.6 46 58 43.4 58 40V24Z" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>

  <!-- Branding Text -->
  <g transform="translate(220, 175)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      PDF <tspan fill="url(#accentGrad)">Pagenio</tspan>
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 290)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5">
      Fast, Secure &amp; Free Online PDF Tools
    </text>
  </g>

  <!-- Subheading -->
  <g transform="translate(100, 355)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94A3B8" letter-spacing="-0.2">
      Merge, Split, Compress to 100KB, Convert, Watermark, and Sign directly in your browser.
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(100, 440)">
    <!-- Pill 1 -->
    <g>
      <rect width="215" height="50" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#38BDF8">⚡ WebAssembly Speed</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(235, 0)">
      <rect width="220" height="50" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#34D399">🔒 100% Client Privacy</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(475, 0)">
      <rect width="190" height="50" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FBBF24">🎯 Exact KB Targets</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(685, 0)">
      <rect width="210" height="50" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#E879F9">🌐 6 Native Languages</text>
    </g>
  </g>

  <!-- Footer URL Brand -->
  <g transform="translate(100, 560)">
    <text font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#64748B" letter-spacing="1">
      PDFPAGENIO.COM • NO INSTALLATION • NO HIDDEN FEES
    </text>
  </g>
</svg>
